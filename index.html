<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Facial Recognition</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        color: #222;
        background: #f5f5f5 url("assets/sanrio-laptop-wallpapers.png") center / cover fixed no-repeat;
        font: 16px system-ui, sans-serif;
      }
      main { max-width: 900px; margin: 0 auto; padding: 24px; background: rgba(255, 255, 255, .88); border-radius: 10px; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 20px; color: #666; }
      .camera { position: relative; overflow: hidden; aspect-ratio: 16 / 10; background: #111; border-radius: 6px; }
      video { display: block; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .message { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; color: white; text-align: center; }
      .message.hidden { display: none; }
      button { padding: 10px 14px; cursor: pointer; }
      button:disabled { cursor: default; opacity: .5; }
      .info { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 16px; color: #555; font-size: 14px; }
      .info strong { color: #222; }
      .aligned { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
      .aligned:empty { display: none; }
      .aligned figure { margin: 0; }
      .aligned img { display: block; width: 112px; height: 112px; border-radius: 6px; }
      .aligned figcaption { margin-top: 4px; color: #555; font-size: 12px; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <h1>Facial Recognition</h1>
      <div class="camera">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div class="message" id="message">
          <div><div id="status">Camera is off</div><button id="start">Start camera</button></div>
        </div>
      </div>
      <div class="info">
        <span>Camera: <strong id="cameraStatus">Off</strong></span>
        <span>Resolution: <strong id="resolution">—</strong></span>
        <span>Faces: <strong id="faceCount">—</strong></span>
        <span>Embedding: <strong id="embeddingStatus">—</strong></span>
        <span>Detection: <strong id="detectStatus">Waiting for camera</strong></span>
      </div>
      <div class="aligned" id="alignedFaces" aria-live="polite"></div>
    </main>
    <script>
      const video = document.getElementById('video');
      const overlay = document.getElementById('overlay');
      const message = document.getElementById('message');
      const status = document.getElementById('status');
      const start = document.getElementById('start');
      const detectStatus = document.getElementById('detectStatus');
      const cameraStatus = document.getElementById('cameraStatus');
      const resolution = document.getElementById('resolution');
      const faceCount = document.getElementById('faceCount');
      const embeddingStatus = document.getElementById('embeddingStatus');
      const alignedFaces = document.getElementById('alignedFaces');
      const frame = document.createElement('canvas');
      let latestDetection = null;
      let detectionTimer = null;

      function scheduleDetection(delay = 0) {
        detectionTimer = setTimeout(runDetection, delay);
      }

      start.addEventListener('click', async () => {
        start.disabled = true;
        start.textContent = 'Starting…';
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user' },
            audio: false
          });
          const track = stream.getVideoTracks()[0];
          const capabilities = track.getCapabilities?.();

          if (capabilities?.width?.max && capabilities?.height?.max) {
            try {
              await track.applyConstraints({
                width: { ideal: capabilities.width.max },
                height: { ideal: capabilities.height.max }
              });
            } catch (error) {
              console.warn('The camera could not use its maximum resolution.', error);
            }
          }

          video.srcObject = stream;
          await video.play();
          const settings = track.getSettings();
          cameraStatus.textContent = 'Live';
          status.textContent = 'Camera is live';
          resolution.textContent = settings.width && settings.height ? `${settings.width} × ${settings.height}` : 'Auto';
          message.classList.add('hidden');
          detectStatus.textContent = 'Starting…';
          track.addEventListener('ended', stopDetection);
          runDetection();
        } catch (error) {
          status.textContent = error.name === 'NotAllowedError' ? 'Camera permission denied' : 'Could not start camera';
          start.disabled = false;
          start.textContent = 'Try again';
        }
      });

      async function runDetection() {
        if (!video.srcObject || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
          scheduleDetection(50);
          return;
        }

        frame.width = video.videoWidth;
        frame.height = video.videoHeight;
        frame.getContext('2d').drawImage(video, 0, 0, frame.width, frame.height);

        try {
          const response = await fetch('/api/detect', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: frame.toDataURL('image/jpeg', 0.8) })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.detail || 'Detection failed');
          latestDetection = result;
          faceCount.textContent = result.faces.length;
          embeddingStatus.textContent = result.faces.length
            ? `${result.faces[0].embedding.dimension}D normalized`
            : '—';
          drawOverlay(result.faces, result.width, result.height);
          drawAlignedFaces(result.faces);
          detectStatus.textContent = 'Live';
        } catch (error) {
          detectStatus.textContent = error.message;
        } finally {
          // Keep one request in flight and begin the next detection immediately.
          if (video.srcObject) scheduleDetection();
        }
      }

      function stopDetection() {
        clearTimeout(detectionTimer);
        video.srcObject = null;
        latestDetection = null;
        overlay.getContext('2d').clearRect(0, 0, overlay.width, overlay.height);
        cameraStatus.textContent = 'Off';
        detectStatus.textContent = 'Waiting for camera';
        faceCount.textContent = '—';
        embeddingStatus.textContent = '—';
        alignedFaces.replaceChildren();
      }

      function drawOverlay(faces, imageWidth, imageHeight) {
        overlay.width = video.clientWidth;
        overlay.height = video.clientHeight;
        const context = overlay.getContext('2d');
        // Match the video's object-fit: cover sizing before mirroring the boxes.
        const scale = Math.max(overlay.width / imageWidth, overlay.height / imageHeight);
        const offsetX = (overlay.width - imageWidth * scale) / 2;
        const offsetY = (overlay.height - imageHeight * scale) / 2;
        context.clearRect(0, 0, overlay.width, overlay.height);
        context.strokeStyle = '#00ff66';
        context.lineWidth = 2;
        faces.forEach(({ box, confidence, landmarks }) => {
          const x = overlay.width - (offsetX + (box.x + box.width) * scale);
          const y = offsetY + box.y * scale;
          context.strokeRect(x, y, box.width * scale, box.height * scale);
          context.fillStyle = '#00ff66';
          context.font = '13px system-ui';
          context.fillText(`${Math.round(confidence * 100)}%`, x, Math.max(14, y - 5));

          context.fillStyle = '#ff4fa3';
          landmarks.forEach((landmark) => {
            const landmarkX = overlay.width - (offsetX + landmark.x * scale);
            const landmarkY = offsetY + landmark.y * scale;
            context.beginPath();
            context.arc(landmarkX, landmarkY, 3, 0, Math.PI * 2);
            context.fill();
          });
        });
      }

      function drawAlignedFaces(faces) {
        const items = faces.map(({ aligned }, index) => {
          const figure = document.createElement('figure');
          const image = document.createElement('img');
          const caption = document.createElement('figcaption');
          image.src = aligned;
          image.alt = `Aligned face ${index + 1}`;
          caption.textContent = `Aligned face ${index + 1}`;
          figure.append(image, caption);
          return figure;
        });
        alignedFaces.replaceChildren(...items);
      }

      window.addEventListener('resize', () => {
        if (latestDetection) {
          drawOverlay(latestDetection.faces, latestDetection.width, latestDetection.height);
        }
      });
    </script>
  </body>
</html>
