<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Facial Recognition</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        color: #222;
        background: #f5f5f5 url("assets/sanrio-laptop-wallpapers.png") center / cover fixed no-repeat;
        font: 16px system-ui, sans-serif;
      }
      main { max-width: 900px; margin: 0 auto; padding: 24px; background: rgba(255, 255, 255, .88); border-radius: 10px; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 20px; color: #666; }
      .camera { position: relative; overflow: hidden; aspect-ratio: 16 / 10; background: #111; border-radius: 6px; }
      video { display: block; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .message { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; color: white; text-align: center; }
      .message.hidden { display: none; }
      button { padding: 10px 14px; cursor: pointer; }
      button:disabled { cursor: default; opacity: .5; }
      .info { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 16px; color: #555; font-size: 14px; }
      .info strong { color: #222; }
      .aligned { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
      .aligned:empty { display: none; }
      .aligned figure { width: 220px; margin: 0; padding: 12px; background: rgba(255, 255, 255, .8); border: 1px solid #ddd; border-radius: 8px; }
      .aligned img { display: block; width: 112px; height: 112px; border-radius: 6px; }
      .aligned figcaption { margin-top: 6px; color: #555; font-size: 12px; }
      .face-identity { min-height: 20px; margin-top: 6px; color: #222; font-weight: 600; }
      .enrollment-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-top: 10px; }
      .enrollment-form label { grid-column: 1 / -1; color: #555; font-size: 12px; }
      .enrollment-form input { min-width: 0; padding: 9px 10px; border: 1px solid #bbb; border-radius: 4px; font: inherit; }
      .enrollment-form input:focus { border-color: #ff4fa3; outline: 2px solid rgba(255, 79, 163, .2); }
      .save-status { grid-column: 1 / -1; min-height: 18px; color: #555; font-size: 12px; }
      .save-status.error { color: #b00020; }
      .save-status.success { color: #087f38; }
    </style>
  </head>
  <body>
    <main>
      <h1>Facial Recognition</h1>
      <div class="camera">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div class="message" id="message">
          <div><div id="status">Camera is off</div><button id="start">Start camera</button></div>
        </div>
      </div>
      <div class="info">
        <span>Camera: <strong id="cameraStatus">Off</strong></span>
        <span>Resolution: <strong id="resolution">—</strong></span>
        <span>Faces: <strong id="faceCount">—</strong></span>
        <span>Embedding: <strong id="embeddingStatus">—</strong></span>
        <span>Detection: <strong id="detectStatus">Waiting for camera</strong></span>
      </div>
      <div class="aligned" id="alignedFaces" aria-live="polite"></div>
    </main>
    <script>
      const video = document.getElementById('video');
      const overlay = document.getElementById('overlay');
      const message = document.getElementById('message');
      const status = document.getElementById('status');
      const start = document.getElementById('start');
      const detectStatus = document.getElementById('detectStatus');
      const cameraStatus = document.getElementById('cameraStatus');
      const resolution = document.getElementById('resolution');
      const faceCount = document.getElementById('faceCount');
      const embeddingStatus = document.getElementById('embeddingStatus');
      const alignedFaces = document.getElementById('alignedFaces');
      const frame = document.createElement('canvas');
      let latestDetection = null;
      let detectionTimer = null;
      let detectionInFlight = false;
      let enrollmentInFlight = false;

      function scheduleDetection(delay = 0) {
        clearTimeout(detectionTimer);
        detectionTimer = setTimeout(() => {
          detectionTimer = null;
          runDetection();
        }, delay);
      }

      start.addEventListener('click', async () => {
        start.disabled = true;
        start.textContent = 'Starting…';
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user' },
            audio: false
          });
          const track = stream.getVideoTracks()[0];
          const capabilities = track.getCapabilities?.();

          if (capabilities?.width?.max && capabilities?.height?.max) {
            try {
              await track.applyConstraints({
                width: { ideal: capabilities.width.max },
                height: { ideal: capabilities.height.max }
              });
            } catch (error) {
              console.warn('The camera could not use its maximum resolution.', error);
            }
          }

          video.srcObject = stream;
          await video.play();
          const settings = track.getSettings();
          cameraStatus.textContent = 'Live';
          status.textContent = 'Camera is live';
          resolution.textContent = settings.width && settings.height ? `${settings.width} × ${settings.height}` : 'Auto';
          message.classList.add('hidden');
          detectStatus.textContent = 'Starting…';
          track.addEventListener('ended', stopDetection);
          runDetection();
        } catch (error) {
          status.textContent = error.name === 'NotAllowedError' ? 'Camera permission denied' : 'Could not start camera';
          start.disabled = false;
          start.textContent = 'Try again';
        }
      });

      async function runDetection() {
        if (!video.srcObject || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
          scheduleDetection(50);
          return;
        }
        if (detectionInFlight || enrollmentInFlight) {
          scheduleDetection(50);
          return;
        }

        frame.width = video.videoWidth;
        frame.height = video.videoHeight;
        frame.getContext('2d').drawImage(video, 0, 0, frame.width, frame.height);
        const capturedImage = frame.toDataURL('image/jpeg', 0.8);
        detectionInFlight = true;

        try {
          const response = await fetch('/api/detect', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: capturedImage })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.detail || 'Detection failed');
          latestDetection = result;
          faceCount.textContent = result.faces.length;
          embeddingStatus.textContent = result.faces.length
            ? `${result.faces[0].embedding.dimension}D normalized`
            : '—';
          drawOverlay(result.faces, result.width, result.height);
          if (!isEnrollmentLocked()) {
            drawAlignedFaces(result.faces, capturedImage);
          }
          detectStatus.textContent = 'Live';
        } catch (error) {
          detectStatus.textContent = error.message;
        } finally {
          detectionInFlight = false;
          // Keep one request in flight and begin the next detection immediately.
          if (video.srcObject && !enrollmentInFlight) scheduleDetection();
        }
      }

      function stopDetection() {
        clearTimeout(detectionTimer);
        detectionTimer = null;
        video.srcObject = null;
        latestDetection = null;
        detectionInFlight = false;
        enrollmentInFlight = false;
        overlay.getContext('2d').clearRect(0, 0, overlay.width, overlay.height);
        cameraStatus.textContent = 'Off';
        detectStatus.textContent = 'Waiting for camera';
        faceCount.textContent = '—';
        embeddingStatus.textContent = '—';
        alignedFaces.replaceChildren();
      }

      function drawOverlay(faces, imageWidth, imageHeight) {
        overlay.width = video.clientWidth;
        overlay.height = video.clientHeight;
        const context = overlay.getContext('2d');
        // Match the video's object-fit: cover sizing before mirroring the boxes.
        const scale = Math.max(overlay.width / imageWidth, overlay.height / imageHeight);
        const offsetX = (overlay.width - imageWidth * scale) / 2;
        const offsetY = (overlay.height - imageHeight * scale) / 2;
        context.clearRect(0, 0, overlay.width, overlay.height);
        context.strokeStyle = '#00ff66';
        context.lineWidth = 2;
        faces.forEach(({ box, confidence, landmarks, identity }) => {
          const x = overlay.width - (offsetX + (box.x + box.width) * scale);
          const y = offsetY + box.y * scale;
          const boxWidth = box.width * scale;
          const boxHeight = box.height * scale;
          context.strokeRect(x, y, boxWidth, boxHeight);
          context.fillStyle = '#00ff66';
          context.font = '13px system-ui';
          context.fillText(`${Math.round(confidence * 100)}%`, x, Math.max(14, y - 5));

          if (identity?.name) {
            context.font = '600 14px system-ui';
            const label = identity.name;
            const labelWidth = context.measureText(label).width;
            const labelX = Math.max(4, Math.min(x, overlay.width - labelWidth - 8));
            const labelY = Math.min(overlay.height - 5, y + boxHeight + 18);
            context.fillStyle = 'rgba(0, 0, 0, .72)';
            context.fillRect(labelX - 4, labelY - 15, labelWidth + 8, 20);
            context.fillStyle = '#00ff66';
            context.fillText(label, labelX, labelY);
          }

          context.fillStyle = '#ff4fa3';
          landmarks.forEach((landmark) => {
            const landmarkX = overlay.width - (offsetX + landmark.x * scale);
            const landmarkY = offsetY + landmark.y * scale;
            context.beginPath();
            context.arc(landmarkX, landmarkY, 3, 0, Math.PI * 2);
            context.fill();
          });
        });
      }

      function isEnrollmentLocked() {
        if (enrollmentInFlight || alignedFaces.querySelector('input:focus')) return true;
        return Array.from(alignedFaces.querySelectorAll('input')).some((input) => input.value.length > 0);
      }

      function drawAlignedFaces(faces, snapshotImage) {
        const items = faces.map((face, index) => {
          const figure = document.createElement('figure');
          const image = document.createElement('img');
          const caption = document.createElement('figcaption');
          const identity = document.createElement('div');
          const form = document.createElement('form');
          const label = document.createElement('label');
          const input = document.createElement('input');
          const save = document.createElement('button');
          const saveStatus = document.createElement('div');

          image.src = face.aligned;
          image.alt = `Aligned face ${index + 1}`;
          caption.textContent = `Aligned face ${index + 1}`;
          identity.className = 'face-identity';
          identity.textContent = face.identity?.name || 'Not recognized';

          form.className = 'enrollment-form';
          label.htmlFor = `face-name-${index}`;
          label.textContent = face.identity?.name ? 'Save another sample or use a new name' : 'Name this face';
          input.id = `face-name-${index}`;
          input.name = 'name';
          input.type = 'text';
          input.maxLength = 128;
          input.autocomplete = 'off';
          input.placeholder = 'Enter a name';
          save.type = 'submit';
          save.textContent = 'Save';
          saveStatus.className = 'save-status';
          saveStatus.setAttribute('role', 'status');
          form.append(label, input, save, saveStatus);
          form.addEventListener('submit', (event) => {
            enrollFace({ event, face, faceIndex: index, snapshotImage, input, save, saveStatus, identity });
          });

          figure.append(image, caption, identity, form);
          return figure;
        });
        alignedFaces.replaceChildren(...items);
      }

      async function enrollFace({ event, face, faceIndex, snapshotImage, input, save, saveStatus, identity }) {
        event.preventDefault();
        const name = input.value.trim();
        if (!name) {
          saveStatus.className = 'save-status error';
          saveStatus.textContent = 'Enter a name first.';
          input.focus();
          return;
        }
        if (enrollmentInFlight) return;

        enrollmentInFlight = true;
        clearTimeout(detectionTimer);
        detectionTimer = null;
        alignedFaces.querySelectorAll('button').forEach((button) => { button.disabled = true; });
        input.disabled = true;
        save.disabled = true;
        save.textContent = 'Saving…';
        saveStatus.className = 'save-status';
        saveStatus.textContent = '';

        try {
          const response = await fetch('/api/enroll', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              image: snapshotImage,
              subject_id: name,
              face_index: faceIndex
            })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(apiErrorMessage(result, 'Could not save this face'));

          const optimisticIdentity = {
            name: result.name,
            subject_id: result.subject_id,
            embedding_id: result.embedding_id,
            similarity: 1
          };
          face.identity = optimisticIdentity;
          if (latestDetection?.faces[faceIndex]) {
            latestDetection.faces[faceIndex].identity = optimisticIdentity;
            drawOverlay(latestDetection.faces, latestDetection.width, latestDetection.height);
          }
          identity.textContent = result.name;
          input.value = '';
          saveStatus.className = 'save-status success';
          saveStatus.textContent = `${result.name} saved.`;
        } catch (error) {
          saveStatus.className = 'save-status error';
          saveStatus.textContent = error.message;
        } finally {
          enrollmentInFlight = false;
          input.disabled = false;
          alignedFaces.querySelectorAll('button').forEach((button) => { button.disabled = false; });
          save.textContent = 'Save';
          if (video.srcObject && !detectionInFlight) scheduleDetection();
        }
      }

      function apiErrorMessage(result, fallback) {
        if (typeof result?.detail === 'string') return result.detail;
        if (Array.isArray(result?.detail)) {
          return result.detail.map((item) => item.msg || String(item)).join('; ');
        }
        return fallback;
      }

      window.addEventListener('resize', () => {
        if (latestDetection) {
          drawOverlay(latestDetection.faces, latestDetection.width, latestDetection.height);
        }
      });
    </script>
  </body>
</html>
